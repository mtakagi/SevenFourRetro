# XcodeGen project spec for SevenFour.
# Generate the Xcode project with:  xcodegen generate
# The generated SevenFour.xcodeproj is not checked in.

name: SevenFour

options:
  bundleIdPrefix: io.github.mtakagi
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: ja
  createIntermediateGroups: true

# Sparkle: updates from GitHub Releases (#61).
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Universal binary: Apple silicon (arm64) + Intel (x86_64)
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES

targets:
  SevenFour:
    type: application
    platform: macOS
    # Shared scheme: build the app, and run SevenFourTests with `xcodebuild test`.
    scheme:
      testTargets:
        - SevenFourTests
    sources:
      - path: SevenFour
        excludes:
          # Copied as a folder reference below
          - "Skin"
          - "Skin/**"
          # Copied as a folder reference below
          - "Licenses"
          - "Licenses/**"
          # Processed via INFOPLIST_FILE
          - "Info.plist"
      # Thread HTML skin, copied as a folder to Contents/Resources/Skin
      - path: SevenFour/Skin
        type: folder
        buildPhase: resources
      # Licenses of what the app includes (Sparkle, #61), copied to
      # Contents/Resources/Licenses
      - path: SevenFour/Licenses
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: Cocoa.framework
      - sdk: WebKit.framework
      # SF Symbol effects (spinning toolbar icons)
      - sdk: Symbols.framework
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: SevenFour
        # Its own identifier, apart from the original SevenFour
        # (com.xrea.s74.quux.SevenFour) and the Swift port
        # (io.github.mtakagi.SevenFour) (#19).
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mtakagi.SevenFourRetro
        INFOPLIST_FILE: SevenFour/Info.plist
        # The app icon, made with Icon Composer (SevenFour/74.icon, #58).
        # actool adds CFBundleIconFile / CFBundleIconName to the Info.plist.
        ASSETCATALOG_COMPILER_APPICON_NAME: "74"
        GENERATE_INFOPLIST_FILE: NO
        # The release's version (the tag is v<MARKETING_VERSION>) and build
        # number; raise both for each release (#19).
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "2"
        GCC_PREFIX_HEADER: SevenFour/SevenFour_Prefix.pch
        GCC_PRECOMPILE_PREFIX_HEADER: YES
        # OgreKit / QuickLite compatibility shims (<OgreKit/OgreKit.h>, <QuickLite/...>)
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/SevenFour/Compat"
        # Legacy code base: manual retain/release (MRC), no modules
        CLANG_ENABLE_OBJC_ARC: NO
        CLANG_ENABLE_MODULES: NO
        GCC_C_LANGUAGE_STANDARD: gnu99
        # objc_msgSend must be cast to the method's type before calling it,
        # and deprecated APIs are warned about (#32).
        ENABLE_STRICT_OBJC_MSGSEND: YES
        GCC_WARN_ABOUT_DEPRECATED_FUNCTIONS: YES
        # Ad-hoc signing so the app runs locally on Apple silicon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # Offline regression tests (#23). Not hosted in the app: the model code is
  # compiled into the test bundle, so tests never launch the app or touch
  # ~/Library/Application Support/SevenFour. Network tests talk to an
  # in-process HTTP server on 127.0.0.1.
  SevenFourTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "Fixtures"
          - "Fixtures/**"
      # Synthetic data, copied as Contents/Resources/Fixtures
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
      # Code under test
      - SevenFour/Ch2Board.m
      - SevenFour/Ch2BoardTree.m
      - SevenFour/Ch2DatParser.m
      - SevenFour/Ch2Thread.m
      - SevenFour/Ch2ShiftJIS.m
      - SevenFour/Compat/OgreKit/OgreKit.m
      - SevenFour/Compat/QuickLite/QuickLite.m
      - path: SevenFour/Ch2Thread.strings
        buildPhase: resources
    dependencies:
      - sdk: Cocoa.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_NAME: SevenFourTests
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mtakagi.SevenFourRetroTests
        GENERATE_INFOPLIST_FILE: YES
        GCC_PREFIX_HEADER: SevenFour/SevenFour_Prefix.pch
        GCC_PRECOMPILE_PREFIX_HEADER: YES
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/SevenFour/Compat"
          - "$(SRCROOT)/SevenFour"
          - "$(SRCROOT)/Tests"
        # Same as the app: MRC, no modules
        CLANG_ENABLE_OBJC_ARC: NO
        CLANG_ENABLE_MODULES: NO
        GCC_C_LANGUAGE_STANDARD: gnu99
        ENABLE_STRICT_OBJC_MSGSEND: YES
        GCC_WARN_ABOUT_DEPRECATED_FUNCTIONS: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
