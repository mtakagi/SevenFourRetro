name: Release

# Pushing a tag v<version> (the MARKETING_VERSION in project.yml, e.g. v2.0)
# builds the app, signs it with the Developer ID certificate, has Apple
# notarize it and puts it in a draft GitHub Release (#19). Check the draft
# and publish it by hand.
#
# Secrets (Settings > Secrets and variables > Actions):
#   DEVELOPER_ID_P12           the "Developer ID Application" certificate and
#                              its private key, exported as .p12, in base64
#   DEVELOPER_ID_P12_PASSWORD  the password of the .p12
#   APPLE_TEAM_ID              the team ID (10 characters)
#   NOTARY_KEY                 an App Store Connect API key (.p8) for notarytool,
#                              in base64
#   NOTARY_KEY_ID              the key's ID
#   NOTARY_ISSUER_ID           the key's issuer ID
#   SPARKLE_PRIVATE_KEY        the EdDSA private key for Sparkle's updates
#                              (generate_keys -x), whose public key is
#                              SUPublicEDKey in Info.plist (#61)
#
# The release also gets appcast.xml, Sparkle's feed: the app reads it from
# releases/latest/download/appcast.xml, so it goes live when the draft is
# published.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Signed and notarized release
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP: build/Build/Products/Release/SevenFour.app
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against the version
        run: |
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' project.yml)
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $VERSION in project.yml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the secrets
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=0
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD APPLE_TEAM_ID NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID SPARKLE_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is not set"
              missing=1
            fi
          done
          exit $missing

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild -project SevenFour.xcodeproj -scheme SevenFour \
            -destination 'platform=macOS' -derivedDataPath build test

      # A keychain of this run only, holding the Developer ID certificate.
      - name: Import the certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # The project signs ad hoc for local builds; the release overrides it
      # with the Developer ID, the hardened runtime and a secure timestamp,
      # which notarization requires. Xcode also gives a built (not archived)
      # app the get-task-allow entitlement, for debugging, which notarization
      # rejects; CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO leaves it out.
      - name: Build (arm64 + x86_64), signed
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -project SevenFour.xcodeproj -scheme SevenFour \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build clean build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN"

      # Sparkle's helpers come signed ad hoc, and Xcode signs only the outer
      # framework; notarization needs every piece signed with the Developer
      # ID and the hardened runtime. The order is Sparkle's (sparkle-project.org/
      # documentation/sandboxing), inside out, then the app.
      - name: Sign Sparkle's helpers
        run: |
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          sign() {
            codesign --force --sign "Developer ID Application" --keychain "$KEYCHAIN" \
              --options runtime --timestamp "$@"
          }
          sign "$SPARKLE/Versions/B/XPCServices/Installer.xpc"
          sign --preserve-metadata=entitlements "$SPARKLE/Versions/B/XPCServices/Downloader.xpc"
          sign "$SPARKLE/Versions/B/Autoupdate"
          sign "$SPARKLE/Versions/B/Updater.app"
          sign "$SPARKLE"
          sign "$APP"

      - name: Check the app
        run: |
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/SevenFour")
          echo "Architectures: $ARCHS"
          for arch in arm64 x86_64; do
            case " $ARCHS " in
              *" $arch "*) ;;
              *) echo "::error::$arch is missing from the app binary"; exit 1 ;;
            esac
          done
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Runtime|Timestamp"
          # Notarization rejects the debugging entitlement.
          ENTITLEMENTS=$(codesign --display --entitlements - --xml "$APP" 2>/dev/null || true)
          echo "Entitlements: ${ENTITLEMENTS:-none}"
          if echo "$ENTITLEMENTS" | grep -q "get-task-allow"; then
            echo "::error::The app has the get-task-allow entitlement, which notarization rejects"
            exit 1
          fi

      - name: Notarize
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          STATUS=$(plutil -extract status raw "$RUNNER_TEMP/notary.json")
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization ended with $STATUS"
            # Apple's log says what was rejected.
            xcrun notarytool log "$(plutil -extract id raw "$RUNNER_TEMP/notary.json")" \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            rm "$RUNNER_TEMP/notary.p8"
            exit 1
          fi
          rm "$RUNNER_TEMP/notary.p8"
          # The ticket goes in the app, so it opens offline too.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Archive app
        run: ditto -c -k --keepParent "$APP" "SevenFour-$VERSION.zip"

      # Sparkle's feed: the last release's appcast.xml with this version
      # added, signed with the EdDSA key. Each version's zip is downloaded
      # from its own release (releases/download/<tag>/). No delta updates:
      # their files would have to be uploaded too.
      - name: Generate the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir appcast
          cp "SevenFour-$VERSION.zip" appcast/
          curl -fsSL -o appcast/appcast.xml \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" \
            || echo "No appcast in the latest release: starting a new one"
          echo "$SPARKLE_PRIVATE_KEY" | build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --maximum-deltas 0 \
            appcast 2>&1 | tee "$RUNNER_TEMP/appcast.log"
          # A key that doesn't match SUPublicEDKey only gives a warning and
          # leaves the update unsigned, which every app would then reject.
          if grep -q "does not match" "$RUNNER_TEMP/appcast.log"; then
            echo "::error::SPARKLE_PRIVATE_KEY doesn't match SUPublicEDKey in Info.plist"
            exit 1
          fi
          BUILD=$(plutil -extract CFBundleVersion raw "$APP/Contents/Info.plist")
          python3 - "$BUILD" "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/SevenFour-$VERSION.zip" <<'PY'
          import sys, xml.etree.ElementTree as ET
          build, url = sys.argv[1], sys.argv[2]
          ns = "{http://www.andymatuschak.org/xml-namespaces/sparkle}"
          items = [i for i in ET.parse("appcast/appcast.xml").iter("item") if i.findtext(ns + "version") == build]
          if len(items) != 1:
              sys.exit(f"::error::appcast.xml has {len(items)} items for build {build}")
          enclosure = items[0].find("enclosure")
          if enclosure.get("url") != url or not enclosure.get(ns + "edSignature"):
              sys.exit(f"::error::The item for build {build} has the wrong URL or no EdDSA signature: {enclosure.attrib}")
          print(f"appcast.xml: build {build} at {url}, signed")
          PY
          cat appcast/appcast.xml

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "SevenFour-$VERSION.zip" appcast/appcast.xml \
            --draft --title "SevenFour $VERSION" --generate-notes

      - name: Remove the keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
